version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Stay on Gradle 9; minor and patch releases still come in.
      - dependency-name: gradle-wrapper
        update-types: [version-update:semver-major]
